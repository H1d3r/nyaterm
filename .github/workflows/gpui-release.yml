name: GPUI Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: GPUI version to release, for example 2.0.0-preview.1
        required: true
        type: string
      upload_release:
        description: Publish GitHub and downstream release channels
        required: true
        default: true
        type: boolean
      source_run_id:
        description: Optional prior Release run ID whose package artifacts should be reused
        required: false
        type: string

permissions:
  actions: read
  contents: write

jobs:
  release:
    uses: nyakang/nyaterm/.github/workflows/release.yml@migration/gpui
    with:
      version: ${{ inputs.version }}
      upload_release: ${{ inputs.upload_release }}
      source_run_id: ${{ inputs.source_run_id }}
      source_ref: migration/gpui
    secrets: inherit
